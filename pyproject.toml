[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "angrymiao-seo"
version = "0.1.0"
description = "Local agent task, evidence and evaluation tools for Angry Miao SEO/GEO"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
am-seo = "am_seo.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
